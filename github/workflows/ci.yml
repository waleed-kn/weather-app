name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verify (lint, typecheck, build)
        run: npm run verify
        env:
          NEXT_PUBLIC_WEATHER_API_KEY: "fcde0f2502702d685d014a0515f2dd85"